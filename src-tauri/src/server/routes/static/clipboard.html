<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share Clip 剪切板</title>
<style>
__CLIPBOARD_CSS__
</style>
<body>
  <main>
    <section>
      <header>
        <div>
          <h1>共享剪切板</h1>
          <p>仅显示已经在 Share Clip 中开启共享的剪切板记录。</p>
        </div>
        <a class="button" href="/">返回共享服务</a>
      </header>
      <div class="content">
        <div class="toolbar">
          <div class="status" id="status">正在加载...</div>
          <div class="toolbar-actions">
            <a class="button" id="prevTop" href="#">上一页</a>
            <button class="button" id="reload" type="button">刷新</button>
            <a class="button" id="nextTop" href="#">下一页</a>
          </div>
        </div>
        <div class="table" id="table">
          <div class="head"><span>类型</span><span>预览</span><span class="hide-sm">大小</span><span class="hide-sm">时间</span><span>操作</span></div>
          <div class="empty" id="empty" hidden>暂无共享剪切板记录。</div>
        </div>
        <div class="pager">
          <a class="button" id="prevBottom" href="#">上一页</a>
          <span class="pager-label" id="pagerLabel"></span>
          <a class="button" id="nextBottom" href="#">下一页</a>
        </div>
      </div>
    </section>
  </main>
  <dialog id="detail">
    <div class="dialog-head">
      <div class="dialog-title" id="detailTitle">剪切板内容</div>
      <button class="button" id="close" type="button">关闭</button>
    </div>
    <div class="dialog-body" id="detailBody"></div>
  </dialog>
<script>
window.__SHARE_CLIP_PAGE__ = __PAGE__;
</script>
<script>
__CLIPBOARD_JS__
</script>
</body>
</html>
